<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Losowanie drużyn</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f4f4f4;
}

h1 { font-size: 32px; }
p { font-size: 18px; }

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 400px;
  margin-bottom: 20px;
}

.playerWrap{
  display:flex;
  gap:6px;
  align-items:center;
  width:100%;
}

/* INPUT MA DOMINOWAĆ */
input {
  flex: 1;
  min-width: 0;
  padding: 10px;
  font-size: 18px;
}

/* MAŁE IKONY */
.genderBtn {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  font-size: 14px;
  border: none;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0.4;
  display:flex;
  align-items:center;
  justify-content:center;
}

.genderBtn.active {
  opacity: 1;
  background: #eaeaea;
  transform: scale(1.05);
}

button {
  padding: 12px 25px;
  font-size: 20px;
  cursor: pointer;
  margin: 5px;
}

/* TRYB WYNIKÓW (jak w oryginale) */
body.results-mode .grid,
body.results-mode h1,
body.results-mode p {
  display: none;
}

body.results-mode table {
  width: 100%;
  font-size: 30px;
}

/* TABELA */
table {
  border-collapse: collapse;
  width: 100%;
  margin-top: 20px;
}

th, td {
  border: 2px solid #333;
  padding: 16px;
  text-align: center;
  font-weight: bold;
}

th {
  font-size: 26px;
  color: white;
}

.teamA { background:#1e90ff; }
.teamB { background:#e74c3c; }

.hidden { display:none; }

/* KOBIETY PO LOSOWANIU */
.woman {
  color: #ffd700;
}
</style>
</head>

<body>

<h1>Generator drużyn</h1>
<p>Wpisz graczy i wylosuj drużyny.</p>

<div class="controls">
  <label><input type="radio" name="mode" value="random" checked> Czysty los</label>
  <label><input type="radio" name="mode" value="women"> Wyrównanie kobiet</label>

  <br><br>

  <button onclick="shuffleTeams()">Losuj drużyny</button>
  <button onclick="reshuffle()">Losuj ponownie</button>
</div>

<div class="grid" id="inputs"></div>

<datalist id="playersList"></datalist>

<table id="results" class="hidden">
<tr>
<th class="teamA">Drużyna A</th>
<th class="teamB">Drużyna B</th>
</tr>
<tbody id="tableBody"></tbody>
</table>

<script>

const inputsContainer = document.getElementById("inputs");
const tableBody = document.getElementById("tableBody");
const resultsTable = document.getElementById("results");
const datalist = document.getElementById("playersList");

let lastPeople = [];

/* BAZA PŁCI */
const genderMap = {
  Adrian:"m", Michał:"m", Jakub:"m", Ewelina:"k",
  Megi:"k", Małgosia:"k", Jacek:"m", Marcin:"m",
  Łukasz:"m", Berat:"m", Dawid:"m", Bartosz:"m",
  Maciej:"m", Krzysiek:"m", Weronika:"k", Agata:"k",
  Bartek:"m", Agnieszka:"k", Klaudiusz:"m", Dominik:"m",
  Wojtek:"m", Natalia:"k", Wojciech:"m", Mateusz:"m"
};

/* PŁEĆ (override + baza) */
function getGender(name){
  return localStorage.getItem("gender_" + name) || genderMap[name] || null;
}

function setGender(name, g){
  localStorage.setItem("gender_" + name, g);
}

/* DATALIST */
function updateDatalist(){
  datalist.innerHTML = "";

  const keys = Object.keys(localStorage)
    .filter(k => k.startsWith("gender_"))
    .map(k => k.replace("gender_",""));

  const all = new Set([...Object.keys(genderMap), ...keys]);

  all.forEach(name=>{
    const opt = document.createElement("option");
    opt.value = name;
    datalist.appendChild(opt);
  });
}

/* INPUTY */
for (let i = 0; i < 12; i++) {

  const row = document.createElement("div");
  row.className = "playerWrap";

  const input = document.createElement("input");
  input.placeholder = "Osoba " + (i + 1);
  input.id = "p" + i;
  input.setAttribute("list","playersList");

  const saved = localStorage.getItem("p" + i);
  if (saved) input.value = saved;

  const btnW = document.createElement("button");
  btnW.innerHTML = "👩";
  btnW.className = "genderBtn";

  const btnM = document.createElement("button");
  btnM.innerHTML = "👨";
  btnM.className = "genderBtn";

  function refresh(){
    const name = input.value.trim();
    const g = getGender(name);

    btnW.classList.remove("active");
    btnM.classList.remove("active");

    if(g === "k") btnW.classList.add("active");
    if(g === "m") btnM.classList.add("active");
  }

  btnW.onclick = () => {
    const name = input.value.trim();
    if(!name) return;
    setGender(name,"k");
    refresh();
  };

  btnM.onclick = () => {
    const name = input.value.trim();
    if(!name) return;
    setGender(name,"m");
    refresh();
  };

  input.addEventListener("input", () => {
    localStorage.setItem("p"+i, input.value);
    refresh();
    updateDatalist();
  });

  row.appendChild(input);
  row.appendChild(btnW);
  row.appendChild(btnM);

  inputsContainer.appendChild(row);

  refresh();
}

updateDatalist();

/* SHUFFLE */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

/* RENDER */
function render(name){
  if(!name) return "";
  const g = getGender(name);
  return `<span class="${g==='k' ? 'woman' : ''}">${name}</span>`;
}

/* MAIN */
function shuffleTeams(savedList=null){

  let people = savedList ? [...savedList] : [];

  if(!savedList){
    for(let i=0;i<12;i++){
      let v=document.getElementById("p"+i).value.trim();
      if(v) people.push(v);
    }
  }

  if(people.length < 2){
    alert("Za mało osób");
    return;
  }

  for(let p of people){
    if(!getGender(p)){
      alert("Brak płci dla: " + p);
      return;
    }
  }

  lastPeople = [...people];

  const mode=document.querySelector('input[name="mode"]:checked').value;

  let women=[], men=[];

  people.forEach(p=>{
    if(getGender(p)==="k") women.push(p);
    else men.push(p);
  });

  shuffle(people);
  shuffle(women);
  shuffle(men);

  let A=[], B=[];
  let mid=Math.ceil(people.length/2);

  if(mode==="random"){
    A = people.slice(0,mid);
    B = people.slice(mid);
  }

  if(mode==="women"){
    let wA = women.slice(0,Math.ceil(women.length/2));
    let wB = women.slice(Math.ceil(women.length/2));

    let menCopy=[...men];
    shuffle(menCopy);

    A=[...wA];
    B=[...wB];

    menCopy.forEach(p=>{
      if(A.length<mid) A.push(p);
      else B.push(p);
    });
  }

  document.body.classList.add("results-mode");
  resultsTable.classList.remove("hidden");

  tableBody.innerHTML="";

  let max=Math.max(A.length,B.length);

  for(let i=0;i<max;i++){
    tableBody.innerHTML+=`
      <tr>
        <td class="teamA">${render(A[i])}</td>
        <td class="teamB">${render(B[i])}</td>
      </tr>
    `;
  }
}

/* RESHUFFLE */
function reshuffle(){
  if(lastPeople.length < 2){
    alert("Najpierw wylosuj drużyny");
    return;
  }
  shuffleTeams(lastPeople);
}

</script>

</body>
</html>
